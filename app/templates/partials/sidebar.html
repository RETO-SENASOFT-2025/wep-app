<aside id="sidebar"
       class="fixed md:fixed inset-y-0 left-0 w-72 transform transition-transform duration-300 -translate-x-full md:translate-x-0 z-40 bg-gradient-to-b from-[#0b2250] to-[#1a3a7a] text-white shadow-xl flex flex-col h-screen">
    <div class="flex flex-col h-full overflow-hidden">
        <div class="px-4 py-5 border-b border-white/10 flex items-center justify-between">
            <h2 class="text-lg font-bold tracking-wide">Conversaciones</h2>
            <button id="closeSidebar"
                    class="md:hidden p-1.5 rounded-full hover:bg-white/20 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-5 w-5"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <div class="p-4 space-y-4 border-b border-white/10">
            <div class="flex gap-2">
                <input id="newChatTitle"
                       type="text"
                       placeholder="Nombre del chat"
                       class="flex-1 rounded-lg px-3 py-2.5 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-[#7FFFD4] shadow-inner" />
                <button id="createChat"
                        class="rounded-lg px-3 py-2.5 text-sm font-medium bg-[#7FFFD4] text-[#0b2250] hover:bg-[#6FEFC4] transition-colors shadow-md">
                    Crear
                </button>
            </div>
            <button id="newChatQuick"
                    class="w-full rounded-lg px-3 py-3 text-sm font-medium bg-white/10 hover:bg-white/20 transition-colors flex items-center justify-center gap-2 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-4 w-4"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Nueva conversación
            </button>
        </div>
        <nav class="flex-1 overflow-y-auto overflow-x-hidden py-4 px-3">
            <ul id="chatList" class="space-y-2.5">
            </ul>
        </nav>
    </div>
</aside>
