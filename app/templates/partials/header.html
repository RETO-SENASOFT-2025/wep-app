<header class="sticky top-0 z-50 bg-[#0b2250] text-white">
  <div class="mx-auto max-w-7xl px-4 py-3 flex items-center gap-3">
    <button id="toggleSidebar" class="md:hidden inline-flex items-center justify-center rounded-md p-2 hover:bg-white/10" aria-label="Abrir menú">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a href="/" class="flex items-center gap-2">
      <img src="{{ request.url_for('static', path='favicon.webp') }}" alt="SuperApp" class="h-6 w-6 rounded" />
      <span class="font-semibold tracking-wide">SuperApp</span>
    </a>
    <div class="ml-auto flex items-center gap-2">
      <input id="chatSearch" type="text" placeholder="Buscar" class="hidden md:block rounded-md px-3 py-1.5 text-sm text-slate-900" />
      <span class="text-xs md:text-sm text-white/80">Innovador, simple y rápido</span>
    </div>
  </div>
</header>
