{% extends "base.html" %}
{% block content %}
<section class="grid gap-6">
  <div class="rounded-2xl bg-gradient-to-r from-white to-gray-50 shadow-lg p-4 sm:p-6 border border-gray-100">
    <div class="flex flex-col sm:flex-row items-center gap-4">
      <div class="bg-gradient-to-r from-[#0b2250] to-[#1a3a7a] p-3 rounded-xl shadow-md">
        <img src="{{ request.url_for('static', path='favicon.webp') }}" alt="SuperApp" class="h-12 w-12 rounded transform hover:scale-105 transition-transform" />
      </div>
      <div class="text-center sm:text-left">
        <h1 class="text-2xl sm:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-[#0b2250] to-[#1a3a7a]">Bienvenido a SuperApp</h1>
        <p class="mt-2 text-sm sm:text-base text-slate-600">Selecciona o crea una conversación desde la barra lateral. Todo se guarda localmente en tu navegador.</p>
      </div>
    </div>
  </div>

  <div class="rounded-2xl bg-white shadow-lg p-0 border border-gray-100 overflow-hidden flex flex-col h-[calc(100vh-240px)] sm:h-[calc(100vh-220px)] md:h-[calc(100vh-200px)]">
    <div class="flex items-center justify-between p-5 border-b border-gray-100 bg-gradient-to-r from-gray-50 to-gray-100">
      <div>
        <h2 class="text-xl font-bold text-[#0b2250]">Conversación activa</h2>
        <p id="activeChatTitle" class="text-sm text-slate-600">Sin conversación seleccionada</p>
      </div>
      <div class="flex gap-2">
        <button id="clearMessages" class="rounded-lg px-4 py-2 text-sm font-medium bg-white hover:bg-red-50 text-red-600 border border-red-200 transition-colors flex items-center gap-2 shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
          Limpiar
        </button>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto p-6 bg-gradient-to-b from-gray-50 to-white">
      <ul id="messagesList" class="space-y-6"></ul>
    </div>

    <div class="p-5 border-t border-gray-100 bg-white shadow-inner">
      <div class="relative">
        <textarea 
          id="messageInput" 
          rows="3" 
          maxlength="500"
          class="w-full rounded-xl border border-gray-200 p-4 pr-20 text-sm focus:outline-none focus:ring-2 focus:ring-[#0b2250] focus:border-transparent shadow-inner" 
          placeholder="Escribe tu mensaje... (Ctrl+Enter para enviar)"
        ></textarea>
        <div id="charCount" class="absolute bottom-3 right-3 text-sm font-medium text-gray-400">0/500</div>
        <button id="sendMessage" class="absolute bottom-3 right-3 rounded-lg px-4 py-2 text-sm font-medium bg-gradient-to-r from-[#0b2250] to-[#1a3a7a] text-white hover:from-[#1a3a7a] hover:to-[#2a4a8a] transition-all transform hover:scale-105 shadow-md">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</section>

<script src="{{ request.url_for('static', path='js/messages.js') }}"></script>
<script>
  // Character counter for message input
  const messageInput = document.getElementById('messageInput');
  const charCount = document.getElementById('charCount');
  
  if (messageInput && charCount) {
    messageInput.addEventListener('input', function() {
      const currentLength = this.value.length;
      charCount.textContent = `${currentLength}/500`;
      
      if (currentLength >= 450) {
        charCount.classList.add('text-red-500');
        charCount.classList.remove('text-gray-400');
      } else {
        charCount.classList.remove('text-red-500');
        charCount.classList.add('text-gray-400');
      }
    });
  }
</script>
{% endblock %}
