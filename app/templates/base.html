<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SuperApp</title>
        <meta name="theme-color" content="#0b2250" />
        <link rel="icon"
              href="{{ request.url_for('static', path='favicon.webp') }}"
              type="image/webp">
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }

    .char-counter-warning {
      color: #f59e0b;
    }

    .char-counter-danger {
      color: #ef4444;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out forwards;
    }
        </style>
    </head>
    <body class="min-h-screen bg-gray-100 text-slate-900">
        {% include "partials/header.html" %}
        {% include "partials/sidebar.html" %}
        <div class="md:ml-72 pt-[72px] min-h-screen">
            <main class="mx-auto max-w-7xl p-4 md:p-6 h-full">
                {% block content %}{% endblock %}
            </main>
        </div>
        <div id="overlay" class="fixed inset-0 bg-black/60 hidden md:hidden z-30"></div>
        <script src="{{ request.url_for('static', path='js/db.js') }}"></script>
        <script src="{{ request.url_for('static', path='js/layout.js') }}"></script>
        <script src="{{ request.url_for('static', path='js/chats.js') }}"></script>
        <script src="{{ request.url_for('static', path='js/status.js') }}"></script>
    </body>
</html>
